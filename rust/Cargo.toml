[package]
name = "siebren"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "siebren"
crate-type = ["cdylib"]

[dependencies]
ndarray = "0.17.1"
pyo3 = "0.27"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
event-listener = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
numpy = "0.27.1"

[dev-dependencies]
rstest = "0.26.1"
